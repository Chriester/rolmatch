name: Deploy

# Despliega producción en Vercel en cada push a main, vía token — el deploy
# sale siempre "como el dueño del proyecto", da igual quién hiciera el commit
# (el plan Hobby de Vercel bloquea deploys de commits de otros autores si se
# usa su integración Git; por eso la desconectamos y desplegamos desde aquí).
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       token personal de Vercel (Account Settings → Tokens)
#   VERCEL_ORG_ID      id de la cuenta/equipo de Vercel
#   VERCEL_PROJECT_ID  id del proyecto rolmatch
#   EXPO_PUBLIC_*      las 3 variables de cliente del .env — expo export las
#                      necesita en el entorno del proceso: NO lee el
#                      .vercel/.env.production.local que baja `vercel pull`
#                      (sin ellas la web sale en blanco: cliente Supabase roto)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_DISCORD_GUILD_ID: ${{ secrets.EXPO_PUBLIC_DISCORD_GUILD_ID }}
      # opcional: sin ella la pestaña GIF del chat no aparece
      EXPO_PUBLIC_TENOR_API_KEY: ${{ secrets.EXPO_PUBLIC_TENOR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull Vercel project config (env vars incluidas)
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # OTA a la app Android (EAS Update): el mismo merge actualiza también los
      # APK instalados, sin rebuild ni reinstalar. Solo corre si existe el
      # secret EXPO_TOKEN (expo.dev → Account Settings → Access tokens).
      - name: EAS Update (OTA Android)
        if: ${{ env.EXPO_TOKEN != '' }}
        run: npx eas-cli update --branch production --message "deploy ${{ github.sha }}" --non-interactive
