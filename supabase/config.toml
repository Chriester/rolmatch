# Config del CLI de Supabase — hace falta para `supabase functions deploy`
# (el flag verify_jwt de cada función vive aquí; sin esto el CLI las
# desplegaría todas con JWT activado y rompería los webhooks).

project_id = "pyysoeztdtxwbtpxwdnl"

# Auth por cabecera x-webhook-secret (webhooks y cron)
[functions.push-notify]
verify_jwt = false

[functions.push-reminders]
verify_jwt = false

[functions.discord-match]
verify_jwt = false

[functions.discord-reminders]
verify_jwt = false

[functions.discord-cleanup]
verify_jwt = false

# Invocadas desde la app con la sesión del usuario. OJO: verify_jwt de la
# pasarela solo entiende los JWT legacy HS256; este proyecto firma con las
# claves nuevas asimétricas (ES256) y la pasarela devolvía
# UNAUTHORIZED_ASYMMETRIC_JWT a todos los usuarios. Ambas funciones validan
# la sesión por dentro (auth.getUser) — la pasarela queda abierta a propósito.
[functions.discord-join]
verify_jwt = false

[functions.redeem-promo]
verify_jwt = false
