<script type="text/babel">

const Frame = ({children}) => <div style={{width:330,background:'var(--bg)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',overflow:'hidden'}}>{children}</div>;
function Demo(){
  const [tab,setTab]=React.useState(0);
  const items=[{icon:'dices',label:'Buscar'},{icon:'sparkles',label:'Matches'},{icon:'message-circle',label:'Mesas'},{icon:'user',label:'Perfil'}];
  return (<div style={{display:'flex',gap:20,padding:20}}>
    <Frame><TopBar logoSrc="../../assets/logo-d20.png" title="Buscar mesa" actionIcon="sliders-horizontal"/><div style={{height:60}}/><BottomNav items={items} active={tab} onChange={setTab}/></Frame>
    <Frame><TopBar onBack={()=>{}} title="La Tumba" actionIcon="share-2"/><div style={{height:60}}/><BottomNav items={items} active={2}/></Frame>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
