<!-- @dsCard group="Colors" viewport="700x210" name="Semantic roles" subtitle="Consume these in product, never the raw scales" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg)}body{padding:16px 20px;font:var(--text-body)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:104px}.s i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border)}.s b{display:block;font:var(--text-caption);margin-top:6px}.s span{display:block;font:var(--text-micro);font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px;font:var(--text-caption)">
<div style="display:flex;align-items:center;gap:8px"><i style="width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--bg)"></i><code style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">--bg</code></div><div style="display:flex;align-items:center;gap:8px"><i style="width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--surface)"></i><code style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">--surface</code></div><div style="display:flex;align-items:center;gap:8px"><i style="width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--surface-raised)"></i><code style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">--surface-raised</code></div><div style="display:flex;align-items:center;gap:8px"><i style="width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--border)"></i><code style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">--border</code></div><div style="display:flex;align-items:center;gap:8px"><i style="width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--text)"></i><code style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">--text</code></div><div style="display:flex;align-items:center;gap:8px"><i style="width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--text-muted)"></i><code style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">--text-muted</code></div><div style="display:flex;align-items:center;gap:8px"><i style="width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--link)"></i><code style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">--link</code></div><div style="display:flex;align-items:center;gap:8px"><i style="width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--focus-ring)"></i><code style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">--focus-ring</code></div><div style="display:flex;align-items:center;gap:8px"><i style="width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--live)"></i><code style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">--live</code></div><div style="display:flex;align-items:center;gap:8px"><i style="width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--selected)"></i><code style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">--selected</code></div><div style="display:flex;align-items:center;gap:8px"><i style="width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--chip-bg)"></i><code style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">--chip-bg</code></div><div style="display:flex;align-items:center;gap:8px"><i style="width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--chip-border)"></i><code style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">--chip-border</code></div>
</div></body></html>
