<!-- @dsCard group="Colors" viewport="700x160" name="Alpha surfaces" subtitle="Chip fills and glass overlays are alpha over the dark background, never solid tints" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg)}body{padding:16px 20px;font:var(--text-body)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:104px}.s i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border)}.s b{display:block;font:var(--text-caption);margin-top:6px}.s span{display:block;font:var(--text-micro);font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style>
</head><body><div class="sw">
<div class="s"><i style="background:var(--alpha-lilac-12)"></i><b>lilac 12%</b><span>chip rest</span></div>
<div class="s"><i style="background:var(--alpha-lilac-28)"></i><b>lilac 28%</b><span>chip active</span></div>
<div class="s"><i style="background:transparent;border:1px solid var(--alpha-lilac-40)"></i><b>border 40%</b><span>chip rest</span></div>
<div class="s"><i style="background:transparent;border:1px solid var(--alpha-lilac-60)"></i><b>border 60%</b><span>chip active</span></div>
<div class="s"><i style="background:var(--alpha-carmine-20)"></i><b>carmine 20%</b><span>live tint</span></div>
<div class="s"><i style="background:var(--scrim)"></i><b>scrim</b><span>#0A090C 72%</span></div>
</div></body></html>
